<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">APIWatch System Architecture &amp; Data Flow</text>
  <text x="480" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">High-reliability decoupled monitoring, event-driven queue, and edge reverse proxy</text>

  <!-- Connection Lines (Underneath nodes) -->
  <!-- Public Internet to Caddy -->
  <path d="M 140 230 L 220 230" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5,4" />
  <!-- Caddy to Next.js Web -->
  <path d="M 370 205 L 450 160" stroke="#38bdf8" stroke-width="2.5" />
  <!-- Next.js Web to Postgres -->
  <path d="M 600 160 L 680 160" stroke="#10b981" stroke-width="2.5" />
  <!-- Next.js Web to Redis -->
  <path d="M 525 210 L 525 270" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4,4" />
  <!-- Redis to Worker -->
  <path d="M 450 320 L 370 320" stroke="#a855f7" stroke-width="2.5" />
  <!-- Worker to Postgres -->
  <path d="M 370 340 L 755 340 L 755 210" stroke="#10b981" stroke-width="2.5" fill="none" />
  <!-- Worker to Alert Destinations -->
  <path d="M 295 375 L 295 430 L 450 430" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" fill="none" />

  <!-- 1. Public Users / Internet -->
  <g transform="translate(40, 185)" filter="url(#shadow)">
    <rect width="100" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="50" cy="38" r="18" fill="#38bdf8" opacity="0.15"/>
    <text x="50" y="44" text-anchor="middle" fill="#38bdf8" font-size="20">🌐</text>
    <text x="50" y="70" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">Clients</text>
    <text x="50" y="82" text-anchor="middle" fill="#64748b" font-size="10">HTTPS / 443</text>
  </g>

  <!-- 2. Caddy Reverse Proxy -->
  <g transform="translate(220, 175)" filter="url(#shadow)">
    <rect width="150" height="110" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="30" rx="12" fill="#0284c7" opacity="0.2"/>
    <text x="75" y="21" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">REVERSE PROXY</text>
    <text x="75" y="52" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Caddy 2.8</text>
    <text x="75" y="70" text-anchor="middle" fill="#94a3b8" font-size="11">Auto TLS (Let's Encrypt)</text>
    <text x="75" y="85" text-anchor="middle" fill="#94a3b8" font-size="11">HTTP/3 QUIC + HSTS</text>
    <text x="75" y="100" text-anchor="middle" fill="#38bdf8" font-size="10">Rate &amp; Size Limit</text>
  </g>

  <!-- 3. Next.js 16 Web App -->
  <g transform="translate(450, 105)" filter="url(#shadow)">
    <rect width="150" height="110" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="30" rx="12" fill="#3b82f6" opacity="0.2"/>
    <text x="75" y="21" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="700">WEB APPLICATION</text>
    <text x="75" y="52" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Next.js 16</text>
    <text x="75" y="70" text-anchor="middle" fill="#94a3b8" font-size="11">Turbopack Standalone</text>
    <text x="75" y="85" text-anchor="middle" fill="#94a3b8" font-size="11">React 19 + Better Auth</text>
    <text x="75" y="100" text-anchor="middle" fill="#60a5fa" font-size="10">Partial Prefetching</text>
  </g>

  <!-- 4. BullMQ / Redis Queue -->
  <g transform="translate(450, 265)" filter="url(#shadow)">
    <rect width="150" height="110" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="30" rx="12" fill="#a855f7" opacity="0.2"/>
    <text x="75" y="21" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">DISTRIBUTED QUEUE</text>
    <text x="75" y="52" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Redis 7 + BullMQ</text>
    <text x="75" y="70" text-anchor="middle" fill="#94a3b8" font-size="11">Append-Only Storage</text>
    <text x="75" y="85" text-anchor="middle" fill="#94a3b8" font-size="11">Atomic Deduplication</text>
    <text x="75" y="100" text-anchor="middle" fill="#c084fc" font-size="10">Internal Network Only</text>
  </g>

  <!-- 5. Background Engine Worker -->
  <g transform="translate(220, 305)" filter="url(#shadow)">
    <rect width="150" height="110" rx="12" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="30" rx="12" fill="#eab308" opacity="0.2"/>
    <text x="75" y="21" text-anchor="middle" fill="#facc15" font-size="12" font-weight="700">MONITORING ENGINE</text>
    <text x="75" y="52" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Worker (Node 22)</text>
    <text x="75" y="70" text-anchor="middle" fill="#94a3b8" font-size="11">Undici + SSRF Shield</text>
    <text x="75" y="85" text-anchor="middle" fill="#94a3b8" font-size="11">Monotonic Clock Latency</text>
    <text x="75" y="100" text-anchor="middle" fill="#facc15" font-size="10">Assertions &amp; Backoff</text>
  </g>

  <!-- 6. PostgreSQL Database -->
  <g transform="translate(680, 105)" filter="url(#shadow)">
    <rect width="150" height="110" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="30" rx="12" fill="#10b981" opacity="0.2"/>
    <text x="75" y="21" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">PERSISTENT DATABASE</text>
    <text x="75" y="52" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">PostgreSQL 16</text>
    <text x="75" y="70" text-anchor="middle" fill="#94a3b8" font-size="11">Prisma 7 ORM</text>
    <text x="75" y="85" text-anchor="middle" fill="#94a3b8" font-size="11">B-Tree Compound Indexes</text>
    <text x="75" y="100" text-anchor="middle" fill="#34d399" font-size="10">AES-256 Encrypted Headers</text>
  </g>

  <!-- 7. Alert Channels (Bottom-right) -->
  <g transform="translate(450, 400)" filter="url(#shadow)">
    <rect width="380" height="60" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="20" y="26" fill="#fbbf24" font-size="13" font-weight="700">ALERT DISPATCH CHANNELS:</text>
    <text x="20" y="46" fill="#94a3b8" font-size="12">📧 SMTP (SendGrid, Resend, SES)  •  🔗 Secure Webhooks (Deduplicated)</text>
  </g>
</svg>
