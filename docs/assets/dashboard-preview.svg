<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="dashShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Top Navigation Bar -->
  <rect width="1000" height="56" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <!-- Logo -->
  <circle cx="40" cy="28" r="14" fill="#2563eb"/>
  <path d="M 33 28 L 38 23 L 43 33 L 47 28" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="34" fill="#ffffff" font-size="16" font-weight="700">API<tspan fill="#38bdf8">Watch</tspan></text>
  <!-- Nav items -->
  <text x="200" y="33" fill="#38bdf8" font-size="13" font-weight="600">Dashboard</text>
  <rect x="200" y="52" width="68" height="3" fill="#38bdf8" rx="1.5"/>
  <text x="300" y="33" fill="#94a3b8" font-size="13">Monitors</text>
  <text x="390" y="33" fill="#94a3b8" font-size="13">Status Page</text>
  <text x="495" y="33" fill="#94a3b8" font-size="13">Alerts</text>
  <!-- User Profile Badge -->
  <rect x="860" y="16" width="105" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="875" cy="29" r="7" fill="#10b981"/>
  <text x="890" y="33" fill="#e2e8f0" font-size="11" font-weight="500">Alex Chen</text>

  <!-- Main Content Header -->
  <text x="40" y="98" fill="#f8fafc" font-size="22" font-weight="700">System Overview</text>
  <text x="40" y="118" fill="#94a3b8" font-size="12">Live API telemetry, health status, and response latency across all endpoints</text>

  <!-- Metric Card 1: Total Monitors -->
  <g transform="translate(40, 135)" filter="url(#dashShadow)">
    <rect width="210" height="90" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="18" y="30" fill="#94a3b8" font-size="11" font-weight="600" text-transform="uppercase">TOTAL MONITORS</text>
    <text x="18" y="65" fill="#f8fafc" font-size="28" font-weight="700">14</text>
    <text x="18" y="80" fill="#10b981" font-size="11">● 13 active, 1 paused</text>
  </g>

  <!-- Metric Card 2: 24h Uptime -->
  <g transform="translate(275, 135)" filter="url(#dashShadow)">
    <rect width="210" height="90" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="18" y="30" fill="#94a3b8" font-size="11" font-weight="600" text-transform="uppercase">24H UPTIME</text>
    <text x="18" y="65" fill="#10b981" font-size="28" font-weight="700">99.98%</text>
    <text x="18" y="80" fill="#64748b" font-size="11">Target SLA: 99.90%</text>
  </g>

  <!-- Metric Card 3: Down Incidents -->
  <g transform="translate(510, 135)" filter="url(#dashShadow)">
    <rect width="210" height="90" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="18" y="30" fill="#94a3b8" font-size="11" font-weight="600" text-transform="uppercase">INCIDENTS</text>
    <text x="18" y="65" fill="#38bdf8" font-size="28" font-weight="700">0</text>
    <text x="18" y="80" fill="#10b981" font-size="11">✓ All services operational</text>
  </g>

  <!-- Metric Card 4: Avg Response Latency -->
  <g transform="translate(745, 135)" filter="url(#dashShadow)">
    <rect width="215" height="90" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="18" y="30" fill="#94a3b8" font-size="11" font-weight="600" text-transform="uppercase">AVG LATENCY</text>
    <text x="18" y="65" fill="#f8fafc" font-size="28" font-weight="700">118<tspan font-size="16" fill="#94a3b8">ms</tspan></text>
    <text x="18" y="80" fill="#38bdf8" font-size="11">↓ -14ms vs last week</text>
  </g>

  <!-- Interactive Latency Chart Card -->
  <g transform="translate(40, 245)" filter="url(#dashShadow)">
    <rect width="920" height="150" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="24" y="28" fill="#f8fafc" font-size="13" font-weight="600">Response Latency Trend (Last 24 Hours)</text>
    <!-- Grid Lines -->
    <line x1="24" y1="55" x2="896" y2="55" stroke="#1e293b" stroke-dasharray="3,3"/>
    <line x1="24" y1="90" x2="896" y2="90" stroke="#1e293b" stroke-dasharray="3,3"/>
    <line x1="24" y1="125" x2="896" y2="125" stroke="#1e293b" stroke-dasharray="3,3"/>
    <!-- Latency Curve Area & Line -->
    <path d="M 30 110 Q 120 70 200 85 T 380 65 T 560 95 T 720 50 T 890 75 L 890 135 L 30 135 Z" fill="url(#chartGrad)"/>
    <path d="M 30 110 Q 120 70 200 85 T 380 65 T 560 95 T 720 50 T 890 75" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="720" cy="50" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <text x="730" y="46" fill="#38bdf8" font-size="11" font-weight="700">82ms (Fastest)</text>
  </g>

  <!-- Active Monitors Table Card -->
  <g transform="translate(40, 415)" filter="url(#dashShadow)">
    <rect width="920" height="145" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <!-- Table Header -->
    <text x="24" y="26" fill="#64748b" font-size="11" font-weight="700">STATUS</text>
    <text x="120" y="26" fill="#64748b" font-size="11" font-weight="700">MONITOR NAME</text>
    <text x="380" y="26" fill="#64748b" font-size="11" font-weight="700">TARGET ENDPOINT</text>
    <text x="640" y="26" fill="#64748b" font-size="11" font-weight="700">INTERVAL</text>
    <text x="740" y="26" fill="#64748b" font-size="11" font-weight="700">LATENCY</text>
    <text x="830" y="26" fill="#64748b" font-size="11" font-weight="700">ACTIONS</text>
    <line x1="24" y1="36" x2="896" y2="36" stroke="#1e293b"/>

    <!-- Row 1 -->
    <rect x="24" y="48" width="55" height="20" rx="10" fill="#065f46"/>
    <text x="51" y="62" text-anchor="middle" fill="#34d399" font-size="10" font-weight="700">UP</text>
    <text x="120" y="63" fill="#f8fafc" font-size="12" font-weight="600">Auth Gateway Production</text>
    <text x="380" y="63" fill="#94a3b8" font-size="12">https://auth.apiwatch.dev/v1/health</text>
    <text x="640" y="63" fill="#94a3b8" font-size="12">30s</text>
    <text x="740" y="63" fill="#34d399" font-size="12" font-weight="600">89ms</text>
    <text x="830" y="63" fill="#38bdf8" font-size="11">Check Now ⚡</text>

    <!-- Row 2 -->
    <rect x="24" y="82" width="55" height="20" rx="10" fill="#065f46"/>
    <text x="51" y="96" text-anchor="middle" fill="#34d399" font-size="10" font-weight="700">UP</text>
    <text x="120" y="97" fill="#f8fafc" font-size="12" font-weight="600">Payment Webhook Receiver</text>
    <text x="380" y="97" fill="#94a3b8" font-size="12">https://billing.apiwatch.dev/webhook</text>
    <text x="640" y="97" fill="#94a3b8" font-size="12">60s</text>
    <text x="740" y="97" fill="#34d399" font-size="12" font-weight="600">142ms</text>
    <text x="830" y="97" fill="#38bdf8" font-size="11">Check Now ⚡</text>

    <!-- Row 3 -->
    <rect x="24" y="116" width="55" height="20" rx="10" fill="#065f46"/>
    <text x="51" y="130" text-anchor="middle" fill="#34d399" font-size="10" font-weight="700">UP</text>
    <text x="120" y="131" fill="#f8fafc" font-size="12" font-weight="600">Public Status Page Endpoint</text>
    <text x="380" y="131" fill="#94a3b8" font-size="12">https://apiwatch.dev/status</text>
    <text x="640" y="131" fill="#94a3b8" font-size="12">30s</text>
    <text x="740" y="131" fill="#34d399" font-size="12" font-weight="600">54ms</text>
    <text x="830" y="131" fill="#38bdf8" font-size="11">Check Now ⚡</text>
  </g>
</svg>
