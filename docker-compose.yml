# ==============================================================================
# APIWatch Production Docker Compose Orchestration
# Services: reverse-proxy (Caddy), web (Next.js 16), worker (Node.js engine),
#           postgres (PostgreSQL 16), redis (Redis 7)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy (Caddy with Automatic SSL / Let's Encrypt)
  # ----------------------------------------------------------------------------
  reverse-proxy:
    image: caddy:2.8-alpine
    container_name: apiwatch-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  # ----------------------------------------------------------------------------
  # 2. Web Application (Next.js 16 Standalone Server)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runner
    container_name: apiwatch-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-apiwatch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apiwatch}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://${APP_DOMAIN}}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM:-noreply@apiwatch.dev}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://${APP_DOMAIN}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  # ----------------------------------------------------------------------------
  # 3. Background Monitoring Worker Engine (BullMQ Consumer & Scheduler)
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-runner
    container_name: apiwatch-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-apiwatch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apiwatch}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM:-noreply@apiwatch.dev}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://${APP_DOMAIN}}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-10}
      - SCHEDULER_INTERVAL_MS=${SCHEDULER_INTERVAL_MS:-10000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net

  # ----------------------------------------------------------------------------
  # 4. Relational Database (PostgreSQL 16) - Private Network Only
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: apiwatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apiwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-apiwatch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apiwatch} -d ${POSTGRES_DB:-apiwatch}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-net
    # Security: Database is NOT exposed to the host/public internet

  # ----------------------------------------------------------------------------
  # 5. Distributed Cache & Task Queue (Redis 7) - Private Network Only
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: apiwatch-redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass "${REDIS_PASSWORD:?Redis password required}"
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend-net
    # Security: Redis is NOT exposed to the host/public internet

# ==============================================================================
# Persistent Volumes & Private Network Topologies
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: false
